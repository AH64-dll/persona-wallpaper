<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0a3fd0">
  <title>Persona</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #fdfefe; }
    canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
    .fallback { position: fixed; inset: 0; display: none; place-items: center; color: #fff; font: 15px/1.5 system-ui, sans-serif; background: #0a3fd0; text-align: center; padding: 24px; }
    .no-webgl .fallback { display: grid; }
  </style>
</head>
<body>
  <canvas id="scene" aria-label="Your character sinking upside down through bright blue water"></canvas>
  <div class="fallback">This scene needs WebGL 2. Try an up-to-date Chrome, Edge or Firefox.</div>
  <iframe id="bgm" src="https://www.youtube.com/embed/zlM4cKcqTSI?autoplay=1&mute=1&start=124&loop=1&playlist=zlM4cKcqTSI&enablejsapi=1" allow="autoplay" style="display:none" title="Background music"></iframe>
  <script>
    (function () {
      var bgm = document.getElementById('bgm');
      function cmd(func) {
        if (bgm.contentWindow) {
          bgm.contentWindow.postMessage(JSON.stringify({ event: 'command', func: func, args: [] }), '*');
        }
      }
      function start() { cmd('playVideo'); cmd('unMute'); }
      ['pointerdown', 'keydown', 'touchstart'].forEach(function (type) {
        window.addEventListener(type, start, { once: true, passive: true });
      });
      window.addEventListener('load', function () { setTimeout(function () { cmd('unMute'); }, 1500); });
    })();
  </script>
  <script src="character-data.js"></script>
  <script src="persona.js"></script>
</body>
</html>
