<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0a3fd0">
  <title>Persona</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #fdfefe; }
    canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
    .fallback { position: fixed; inset: 0; display: none; place-items: center; color: #fff; font: 15px/1.5 system-ui, sans-serif; background: #0a3fd0; text-align: center; padding: 24px; }
    .no-webgl .fallback { display: grid; }
  </style>
</head>
<body>
  <canvas id="scene" aria-label="Your character sinking upside down through bright blue water"></canvas>
  <div class="fallback">This scene needs WebGL 2. Try an up-to-date Chrome, Edge or Firefox.</div>
  <audio id="bgm" src="bgm.m4a" loop preload="auto"></audio>
  <script>
    (function () {
      var a = document.getElementById('bgm');
      var audible = false, kicks = 0;
      function tryPlay(withSound) {
        a.muted = !withSound;
        var p = a.play();
        if (p && p.then) {
          p.then(function () { if (withSound) audible = true; })
           .catch(function () { if (withSound) tryPlay(false); });
        }
      }
      tryPlay(true);
      ['pointerdown', 'keydown', 'touchstart'].forEach(function (type) {
        window.addEventListener(type, function () {
          if (!audible) { a.currentTime = 0; tryPlay(true); }
        }, { passive: true });
      });
      var timer = setInterval(function () {
        if (audible || ++kicks > 60) { clearInterval(timer); return; }
        if (a.paused) tryPlay(true);
      }, 1500);
    })();
  </script>
  <script src="character-data.js"></script>
  <script src="persona.js"></script>
</body>
</html>
